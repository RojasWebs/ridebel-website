# Initial HTTP configuration. Add HTTPS with Certbot before routing public traffic.
# Keep the existing server configuration until this has been adapted and tested.
server {
    listen 80;
    server_name ridebel.com www.ridebel.com;
    server_tokens off;
    client_max_body_size 32k;
    # Avoid retaining contact content, query strings, and infrastructure errors.
    access_log off;
    error_log /dev/null crit;

    location /static/ {
        alias /srv/ridebel/staticfiles/;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
